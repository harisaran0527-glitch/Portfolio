<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  
  <defs>
    <!-- Silver Platinum Linear Gradient for Main Wings -->
    <linearGradient id="silverMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Sleek Titanium Gradient for Lower Facets -->
    <linearGradient id="titaniumDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Electric Cyan Prism Accent -->
    <linearGradient id="cyanPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Cyan Edge Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <g transform="translate(235, 30) scale(0.65)">
    <!-- SUBTLE AMBIENT CYAN LIGHT GLOW AT CORE -->
    <ellipse cx="256" cy="256" rx="120" ry="120" fill="url(#cyanPrism)" opacity="0.12" filter="url(#cyanGlow)" />

    <!-- UPPER WING -->
    <path d="M 370 110 
             L 200 110 
             L 140 170 
             L 140 200 
             L 280 200 
             L 340 260 
             L 360 240 
             L 360 210 
             L 230 210 
             L 200 180 
             L 200 160 
             L 370 160 
             Z" 
          fill="url(#silverMain)" />

    <!-- LOWER WING -->
    <path d="M 142 402 
             L 312 402 
             L 372 342 
             L 372 312 
             L 232 312 
             L 172 252 
             L 152 272 
             L 152 302 
             L 282 302 
             L 312 332 
             L 312 352 
             L 142 352 
             Z" 
          fill="url(#titaniumDark)" />

    <!-- CENTER DIAGONAL LIGHT CANAL BEAM -->
    <path d="M 175 252 L 335 252 L 315 272 L 155 272 Z" 
          fill="url(#cyanPrism)" 
          filter="url(#cyanGlow)" 
          opacity="0.9" />

    <!-- BEVEL CHAMFER ACCENTS -->
    <polygon points="370,110 390,135 370,160" fill="url(#cyanPrism)" />
    <polygon points="142,402 122,377 142,352" fill="url(#cyanPrism)" />
  </g>
  
  <g transform="translate(180, 450) scale(1.3)">
    <!-- Letter S -->
    <path d="M 50 10 L 10 10 L 0 20 L 0 28 L 38 28 L 48 38 L 48 48 L 0 48 L 0 60 L 40 60 L 50 50 L 50 36 L 12 36 L 2 26 L 2 22 L 50 22 Z" fill="url(#silverMain)" />

    <!-- Letter A -->
    <path d="M 85 10 L 65 60 L 77 60 L 82 46 L 102 46 L 107 60 L 119 60 L 99 10 Z M 92 20 L 99 36 L 85 36 Z" fill="url(#silverMain)" />

    <!-- Letter R -->
    <path d="M 130 10 L 130 60 L 142 60 L 142 38 L 156 38 L 168 60 L 182 60 L 168 36 C 176 34, 180 28, 180 22 C 180 14, 172 10, 160 10 Z M 142 20 L 158 20 C 164 20, 168 22, 168 26 C 168 30, 164 30, 158 30 L 142 30 Z" fill="url(#silverMain)" />

    <!-- Letter A -->
    <path d="M 215 10 L 195 60 L 207 60 L 212 46 L 232 46 L 237 60 L 249 60 L 229 10 Z M 222 20 L 229 36 L 215 36 Z" fill="url(#silverMain)" />

    <!-- Letter N (Corrected Forward Trajectory) -->
    <path d="M 260 10 L 272 10 L 296 44 L 296 10 L 308 10 L 308 60 L 296 60 L 272 26 L 272 60 L 260 60 Z" fill="url(#silverMain)" />

    <!-- Brand Cyan Period "." -->
    <polygon points="322,48 334,48 334,60 322,60" fill="url(#cyanPrism)" filter="url(#cyanGlow)" />
  </g>
</svg>